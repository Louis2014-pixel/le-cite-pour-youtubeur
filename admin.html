<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Le cite pour Youtubeur</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div class="brand">
          <h1>Panneau d'administration</h1>
        </div>
        <div class="actions">
          <a href="index.html" class="secondary-button">Retour</a>
        </div>
      </section>

      <section id="adminLoginPanel" class="login-panel" aria-label="Acces administrateur">
        <label>
          Mot de passe administrateur
          <input id="adminPasswordInput" type="password" autocomplete="current-password" />
        </label>
        <button id="adminUnlockButton" class="primary-button" type="button">Debloquer</button>
        <p id="adminMessage" class="login-message"></p>
      </section>

      <section id="addressPanel" class="address-panel" aria-label="Adresses des utilisateurs" hidden>
        <h2>Adresses des utilisateurs</h2>
        <div id="addressList" class="address-list"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
